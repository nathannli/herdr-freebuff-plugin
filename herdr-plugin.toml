id = "freebuff.integration"
name = "Freebuff"
version = "0.2.0"
min_herdr_version = "0.9.1"
# "session restore" is struck through in the description below because it is not
# implemented, and currently cannot be. It is left visible rather than deleted so
# the gap is not mistaken for an oversight.
#
# Herdr 0.9.1 does support this: its report call takes `--agent-session-id ID`
# and `--agent-session-path PATH`, and `resume_agents_on_restore` is a config
# key. So herdr would restore a plugin agent that reported a session id. The
# plugin never reports one, because freebuff exposes nothing that can be
# resumed unambiguously:
#
#   * freebuff 0.1.2 has no `--agent-session-id` of its own, and the only
#     session-shaped id on disk is the `cli:<uuid>` instanceId in
#     ~/.config/manicode/freebuff-live-<pid>.json.
#   * `freebuff --continue` does not read that instanceId. It uses the value
#     verbatim as a directory name under
#     ~/.config/manicode/projects/<basename(cwd)>/chats/ — the chat directory
#     name is the conversation id — and on a miss it logs at debug level and
#     silently resumes the most recent chat in that project instead.
#
# Reporting an id that freebuff would mis-resolve is worse than reporting none:
# a restore would silently reopen the wrong conversation. The safe value does
# not exist yet, so nothing is reported.
#
# Note that pane *lifecycle state* does survive a restart, via the [[startup]]
# hook below, which re-attaches watchers to surviving panes. What does not
# happen is freebuff being relaunched into the same conversation. `resume-last`
# is a manual resume the user triggers, and is the whole of it.
description = "Launch and manage Freebuff agents inside Herdr, with ~~session restore~~ (not implemented: freebuff exposes no resumable session id — see note above), adoption of manually started sessions, and lifecycle state."
# The scripts are POSIX sh and require node. No Windows support.
platforms = ["linux", "macos"]

# Interactive Freebuff sessions run as plugin PANE entrypoints. Herdr opens a
# real terminal PTY for each, so freebuff's TUI gets a TTY (actions/CLI have
# none and cannot launch interactive agents). Bind these in your herdr config:
#   [[keys.command]]
#   key = "prefix+f"
#   type = "shell"
#   command = "herdr plugin pane open --plugin freebuff.integration --entrypoint task"
#   description = "Freebuff: new task"
#
# There is no `plugin_pane` key type in herdr 0.9.1; reload-config rejects it.

# Runs at server start and after a restore: sweeps state for panes that are
# gone, re-attaches watchers to surviving freebuff panes, adopts panes running a
# freebuff the user started by hand, and starts the periodic sweep daemon that
# keeps doing all three (herdr 0.9.1 has no way to hook pane creation).
[[startup]]
command = ["sh", "scripts/prune-state.sh"]

[[panes]]
id = "task"
title = "Freebuff"
placement = "split"
command = ["sh", "scripts/launch.sh", "task"]

[[panes]]
id = "resume-last"
title = "Freebuff (last session)"
placement = "split"
command = ["sh", "scripts/launch.sh", "resume-last"]

[[actions]]
id = "notify"
title = "Freebuff: send notification"
contexts = ["workspace", "pane"]
command = ["sh", "scripts/notify.sh"]
